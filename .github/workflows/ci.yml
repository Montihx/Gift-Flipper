name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: giftflipper
          POSTGRES_PASSWORD: giftflipper
          POSTGRES_DB: giftflipper
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U giftflipper"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DRY_RUN: "true"
      DATABASE_URL: postgresql+asyncpg://giftflipper:giftflipper@localhost:5432/giftflipper
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --python 3.12 --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
      - name: Migrations up/down/up and model drift
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head
          uv run alembic check

  webapp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webapp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webapp/package-lock.json
      - run: npm ci
      - run: npm run build
